[package]
name = "chemchron-laser"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Dominik Sorger"]
description = "ChemChron LA-ICP-MS part: spot trace elements and U-Th-Pb from raw sweeps to traceable results"

[dependencies]
chemchron-laser-core = { path = "core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "clipboard"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = "0.37"

[[bin]]
name = "chemchron-laser"
path = "src/main.rs"
