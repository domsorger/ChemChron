[package]
name = "chemchron-core"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Dominik Sorger"]
description = "ChemChron EPMA chemical dating and combined U-Pb/trace-element calculations. No window code."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
calamine = "0.38"
regex = "1"
rust_xlsxwriter = "0.102"
